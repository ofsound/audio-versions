<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas -->
    <radialGradient id="bg-grad-07" cx="50%" cy="50%" r="85%">
      <stop offset="0%" stop-color="#141e33"/>
      <stop offset="60%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#04060c"/>
    </radialGradient>

    <!-- Glowing Tube Gradients -->
    <linearGradient id="loop-grad-07a" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <linearGradient id="loop-grad-07b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <filter id="glow-07" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow-07" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad-07)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Radial Sound Ripples -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#10b981" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#38bdf8" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="12 8"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5"/>

  <!-- Infinity Loop Monogram AV Path -->
  <g filter="url(#shadow-07)">
    <!-- Base Shadow Glow Loop -->
    <path d="M 160 350 C 110 270 140 130 220 130 C 270 130 256 240 256 256 C 256 272 242 380 292 380 C 372 380 402 240 352 160 C 302 80 230 180 160 350 Z" fill="none" stroke="#059669" stroke-width="32" opacity="0.3" filter="url(#glow-07)"/>

    <!-- Main Gradient Tube Loop -->
    <!-- Loop Part 1: Left 'A' Loop Peak -->
    <path d="M 140 340 C 96 260 130 130 216 130 C 264 130 256 220 256 256" fill="none" stroke="url(#loop-grad-07a)" stroke-width="28" stroke-linecap="round"/>

    <!-- Loop Part 2: Right 'V' Loop Trough -->
    <path d="M 256 256 C 256 292 248 380 300 380 C 380 380 406 250 360 160 C 314 70 236 170 140 340" fill="none" stroke="url(#loop-grad-07b)" stroke-width="28" stroke-linecap="round"/>

    <!-- Intersecting 'A' Crossbar Audio Connector -->
    <line x1="162" y1="260" x2="274" y2="260" stroke="#6ee7b7" stroke-width="12" stroke-linecap="round" filter="url(#glow-07)"/>

    <!-- Shiny Specular Highlights -->
    <path d="M 145 330 C 105 260 138 142 216 142" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round"/>
    <path d="M 300 368 C 368 368 392 250 352 170" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round"/>

    <!-- Central Audio Nodes -->
    <circle cx="216" cy="130" r="8" fill="#ffffff" filter="url(#glow-07)"/>
    <circle cx="300" cy="380" r="8" fill="#ffffff" filter="url(#glow-07)"/>
  </g>
</svg>
