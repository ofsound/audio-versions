<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <title>Interlocking ribbons with balanced waveform</title>
  <defs>
    <linearGradient id="bg-grad-balanced" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>
    <linearGradient id="top-gloss-balanced" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="emerald-grad-balanced" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="sky-grad-balanced" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="wave-grad-balanced" gradientUnits="userSpaceOnUse" x1="172" y1="0" x2="340" y2="0">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="52%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow-balanced" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="shadow-blur"/>
      <feOffset in="shadow-blur" dx="0" dy="12" result="shadow-offset"/>
      <feFlood flood-color="#000000" flood-opacity="0.58" result="shadow-color"/>
      <feComposite in="shadow-color" in2="shadow-offset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad-balanced)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#top-gloss-balanced)"/>

  <g filter="url(#shadow-balanced)">
    <path d="M 136 376 L 232 136 C 238 121 274 121 280 136 L 316 226 L 272 242 L 256 200 L 180 376 Z" fill="url(#emerald-grad-balanced)"/>
    <path d="M 376 136 L 280 376 C 274 391 238 391 232 376 L 196 286 L 240 270 L 256 312 L 332 136 Z" fill="url(#sky-grad-balanced)"/>

    <!-- Evenly spaced, mirrored waveform with a calm central valley. -->
    <g fill="url(#wave-grad-balanced)">
      <rect x="172" y="264" width="8" height="24" rx="4" opacity="0.82"/>
      <rect x="186" y="254" width="8" height="44" rx="4" opacity="0.88"/>
      <rect x="200" y="242" width="8" height="68" rx="4" opacity="0.94"/>
      <rect x="214" y="250" width="8" height="52" rx="4"/>
      <rect x="228" y="232" width="8" height="88" rx="4"/>
      <rect x="242" y="246" width="8" height="60" rx="4"/>
      <rect x="256" y="258" width="8" height="36" rx="4"/>
      <rect x="270" y="246" width="8" height="60" rx="4"/>
      <rect x="284" y="232" width="8" height="88" rx="4"/>
      <rect x="298" y="250" width="8" height="52" rx="4"/>
      <rect x="312" y="242" width="8" height="68" rx="4" opacity="0.94"/>
      <rect x="326" y="254" width="8" height="44" rx="4" opacity="0.88"/>
      <rect x="340" y="264" width="8" height="24" rx="4" opacity="0.82"/>
    </g>
  </g>
</svg>
