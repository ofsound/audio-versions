<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas -->
    <radialGradient id="bg-grad-05" cx="40%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="60%" stop-color="#0f0f17"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>

    <!-- Vibrant Ambient Light Orbs underneath Glass -->
    <radialGradient id="orb-emerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orb-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orb-indigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Surface Gradient -->
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="glass-grad-reverse" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>

    <filter id="blur-glow-05" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="36" result="blur"/>
    </filter>

    <filter id="shadow-05" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Container Shell -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad-05)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Backlight Color Orbs for Glass Effect -->
  <circle cx="210" cy="190" r="140" fill="url(#orb-emerald)" filter="url(#blur-glow-05)"/>
  <circle cx="310" cy="320" r="140" fill="url(#orb-cyan)" filter="url(#blur-glow-05)"/>
  <circle cx="256" cy="256" r="100" fill="url(#orb-indigo)" filter="url(#blur-glow-05)"/>

  <!-- Glass Layer 1: 'A' Apex Chevron -->
  <g filter="url(#shadow-05)">
    <path d="M 256 112 L 392 352 L 320 352 L 256 240 L 192 352 L 120 352 Z" fill="url(#glass-grad)" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Glass Layer 2: 'V' Trough Chevron (Inverted & Overlapping) -->
    <path d="M 256 400 L 120 160 L 192 160 L 256 272 L 320 160 L 392 160 Z" fill="url(#glass-grad-reverse)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>

    <!-- Central Intersection Diamond Prism (Highlighted Glass) -->
    <polygon points="256,220 296,256 256,292 216,256" fill="#ffffff" fill-opacity="0.3" stroke="#6ee7b7" stroke-width="2"/>

    <!-- Concentric Sound Ring Reflections -->
    <path d="M 226 256 A 30 30 0 0 1 286 256" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

    <!-- Audio Pulse Nodes -->
    <circle cx="256" cy="112" r="8" fill="#34d399"/>
    <circle cx="256" cy="400" r="8" fill="#38bdf8"/>
  </g>
</svg>
