<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Studio Canvas Gradient -->
    <radialGradient id="bg-grad-10" cx="50%" cy="40%" r="85%">
      <stop offset="0%" stop-color="#181820"/>
      <stop offset="60%" stop-color="#0e0e14"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>

    <!-- Gold Metallic Calligraphic Gradient -->
    <linearGradient id="gold-grad-10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Emerald Metallic Calligraphic Gradient -->
    <linearGradient id="emerald-grad-10" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <filter id="glow-10" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow-10" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- App Card Outer Shell -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad-10)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#eab308" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Elegant Sound Wave Aura Radiance -->
  <path d="M 176 256 A 80 80 0 0 1 336 256" fill="none" stroke="#10b981" stroke-opacity="0.15" stroke-width="2"/>
  <path d="M 144 256 A 112 112 0 0 1 368 256" fill="none" stroke="#eab308" stroke-opacity="0.15" stroke-width="2"/>
  <path d="M 112 256 A 144 144 0 0 1 400 256" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5"/>

  <!-- Architectural Dual-Vertex AV Monogram -->
  <g filter="url(#shadow-10)">
    <!-- Architectural 'A' Chevron Mark -->
    <path d="M 256 100 L 384 320 L 344 320 L 256 168 L 168 320 L 128 320 Z" fill="url(#emerald-grad-10)"/>

    <!-- Architectural 'V' Inverted Chevron Mark (Interlocking Valley) -->
    <path d="M 256 412 L 128 192 L 168 192 L 256 344 L 344 192 L 384 192 Z" fill="url(#gold-grad-10)"/>

    <!-- Fine Geometric Horizontal Audio Crossbar with Version Dot -->
    <line x1="178" y1="256" x2="334" y2="256" stroke="#ffffff" stroke-width="3" stroke-linecap="round" filter="url(#glow-10)"/>
    <circle cx="256" cy="256" r="10" fill="#ffffff" filter="url(#glow-10)"/>
    <circle cx="256" cy="256" r="5" fill="#0f172a"/>
  </g>
</svg>
