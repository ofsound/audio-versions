<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Studio Background -->
    <radialGradient id="bg-grad-02" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Facet Gradients for 3D Ribbon -->
    <linearGradient id="facet-01" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="facet-02" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="facet-03" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="facet-04" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="facet-05" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="shadow-02" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glow-02" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Card Shell -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad-02)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Background Sound Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#34d399" stroke-opacity="0.1" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Origami 3D AV Structure -->
  <g filter="url(#shadow-02)">
    <!-- Facet 1: Ascending Left Leg of 'A' -->
    <polygon points="120,384 180,384 256,128 200,128" fill="url(#facet-01)"/>

    <!-- Facet 2: Peak Fold of 'A' into Middle Descent -->
    <polygon points="256,128 200,128 300,288 336,240" fill="url(#facet-02)"/>

    <!-- Facet 3: 'V' Valley Center Dip -->
    <polygon points="300,288 336,240 256,384 220,384" fill="url(#facet-03)"/>

    <!-- Facet 4: Rising Right Leg of 'V' -->
    <polygon points="256,384 220,384 340,128 392,128" fill="url(#facet-04)"/>

    <!-- Facet 5: Dynamic Overlap Bridge & Audio Bar -->
    <polygon points="170,270 342,270 322,302 150,302" fill="url(#facet-05)" filter="url(#glow-02)" opacity="0.95"/>

    <!-- Audio Node Pulse Circles at Peaks -->
    <circle cx="228" cy="128" r="12" fill="#6ee7b7" filter="url(#glow-02)"/>
    <circle cx="238" cy="384" r="12" fill="#38bdf8" filter="url(#glow-02)"/>
  </g>
</svg>
