<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vinyl Disc Backdrop -->
    <radialGradient id="bg-grad-09" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1c1d24"/>
      <stop offset="40%" stop-color="#121318"/>
      <stop offset="80%" stop-color="#0a0a0e"/>
      <stop offset="100%" stop-color="#040406"/>
    </radialGradient>

    <!-- Vinyl Center Label Gradient -->
    <linearGradient id="label-grad-09" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="groove-glow-a" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <linearGradient id="groove-glow-v" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <filter id="glow-09" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow-09" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- App Shell -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad-09)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Concentric Vinyl Sound Grooves -->
  <g opacity="0.35">
    <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="256" cy="256" r="190" fill="none" stroke="#ffffff" stroke-width="1"/>
    <circle cx="256" cy="256" r="170" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-width="1"/>
    <circle cx="256" cy="256" r="130" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="256" cy="256" r="110" fill="none" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Stylized AV Grooves cut through Vinyl Disc -->
  <g filter="url(#shadow-09)">
    <!-- 'A' Left Apex Path -->
    <path d="M 140 370 L 240 140 C 248 122 264 122 272 140 L 302 206 L 256 228 L 220 180 L 176 370 Z" fill="url(#groove-glow-a)" filter="url(#glow-09)"/>

    <!-- 'V' Right Trough Path -->
    <path d="M 372 142 L 272 372 C 264 390 248 390 240 372 L 210 306 L 256 284 L 292 332 L 336 142 Z" fill="url(#groove-glow-v)" filter="url(#glow-09)"/>

    <!-- Center Vinyl Record Label Circle -->
    <circle cx="256" cy="256" r="64" fill="url(#label-grad-09)" filter="url(#shadow-09)"/>
    <circle cx="256" cy="256" r="64" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>

    <!-- Center Record Spindle & Audio Play Icon -->
    <circle cx="256" cy="256" r="20" fill="#0f172a"/>
    <circle cx="256" cy="256" r="8" fill="#ffffff"/>
    <polygon points="253,250 262,256 253,262" fill="#10b981"/>
  </g>
</svg>
