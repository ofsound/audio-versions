<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-01" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>

    <!-- App Icon Gloss / Highlight -->
    <linearGradient id="top-gloss-01" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="emerald-grad-01" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="sky-grad-01" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="cross-grad-01" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow-01" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#059669" flood-opacity="0.2"/>
    </filter>

    <filter id="glow-01" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Icon Shape -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad-01)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#top-gloss-01)"/>

  <!-- Main Symbol: Interlocking A & V Ribbons -->
  <g filter="url(#shadow-01)">
    <!-- 'A' Left Leg -->
    <path d="M 136 376 L 232 136 C 238 121 274 121 280 136 L 316 226 L 272 242 L 256 200 L 180 376 Z" fill="url(#emerald-grad-01)"/>

    <!-- 'V' Right Leg -->
    <path d="M 376 136 L 280 376 C 274 391 238 391 232 376 L 196 286 L 240 270 L 256 312 L 332 136 Z" fill="url(#sky-grad-01)"/>

    <!-- Audio Wave Lines on the interlocking ribbons -->
    <rect x="216" y="260" width="6" height="32" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="232" y="248" width="6" height="56" rx="3" fill="#ffffff"/>
    <rect x="248" y="236" width="6" height="80" rx="3" fill="#6ee7b7" filter="url(#glow-01)"/>
    <rect x="264" y="248" width="6" height="56" rx="3" fill="#38bdf8"/>
    <rect x="280" y="260" width="6" height="32" rx="3" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
