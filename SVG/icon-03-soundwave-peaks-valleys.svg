<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-03" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#060a17"/>
      <stop offset="100%" stop-color="#020308"/>
    </linearGradient>

    <linearGradient id="wave-grad-a" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <linearGradient id="wave-grad-v" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>

    <linearGradient id="line-glow-03" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <filter id="glow-03" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow-03" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad-03)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Subtle Audio Spectrum Grid Lines -->
  <line x1="80" y1="256" x2="432" y2="256" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="80" y1="176" x2="432" y2="176" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="80" y1="336" x2="432" y2="336" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Waveform Bars Forming 'A' Peak (Left) and 'V' Dip (Right) -->
  <g filter="url(#shadow-03)">
    <!-- 'A' Soundwave Peak Bars -->
    <rect x="112" y="220" width="16" height="72" rx="8" fill="url(#wave-grad-a)"/>
    <rect x="144" y="170" width="16" height="172" rx="8" fill="url(#wave-grad-a)"/>
    <rect x="176" y="120" width="16" height="272" rx="8" fill="url(#wave-grad-a)" filter="url(#glow-03)"/>
    <rect x="208" y="170" width="16" height="172" rx="8" fill="url(#wave-grad-a)"/>

    <!-- Center Bridge Wave -->
    <rect x="248" y="216" width="16" height="80" rx="8" fill="url(#line-glow-03)" filter="url(#glow-03)"/>

    <!-- 'V' Soundwave Trough Bars -->
    <rect x="288" y="170" width="16" height="172" rx="8" fill="url(#wave-grad-v)"/>
    <rect x="320" y="120" width="16" height="272" rx="8" fill="url(#wave-grad-v)"/>
    <rect x="352" y="220" width="16" height="172" rx="8" fill="url(#wave-grad-v)" filter="url(#glow-03)"/>
    <rect x="384" y="220" width="16" height="72" rx="8" fill="url(#wave-grad-v)"/>

    <!-- Overlay Vector Ribbon Outline connecting the peaks & troughs -->
    <path d="M 120 256 L 184 120 L 256 256 L 328 392 L 392 256" fill="none" stroke="url(#line-glow-03)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-03)"/>

    <!-- Peak and Trough Nodes -->
    <circle cx="184" cy="120" r="8" fill="#ffffff"/>
    <circle cx="328" cy="392" r="8" fill="#ffffff"/>
  </g>
</svg>
